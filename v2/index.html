<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PBK: Path to Black Belt — Combat Pass</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0d0f13;font-family:system-ui,Segoe UI,Arial,sans-serif;touch-action:none}
    canvas{display:block}
    #ui{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 8px #000}
    #score{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:clamp(22px,4vw,34px);font-weight:950;letter-spacing:.8px;white-space:nowrap;background:#090b0fd9;border:1px solid #ffffff24;padding:8px 14px;border-radius:12px;backdrop-filter:blur(6px)}
    #status{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:clamp(14px,2.5vw,20px);font-weight:900;letter-spacing:.7px}
    #hint{position:absolute;left:14px;bottom:12px;background:#000b;padding:9px 11px;border-radius:10px;font-size:12px;border:1px solid #ffffff24}
    #touch{position:fixed;inset:0;pointer-events:none;display:none}
    .pad,.actions{position:absolute;bottom:18px;pointer-events:auto}
    .pad{left:16px;width:156px;height:156px}
    .actions{right:16px;width:204px;height:168px}
    .btn{position:absolute;width:62px;height:62px;border:1px solid #ffffff55;border-radius:50%;background:#111c;color:white;font-weight:900;display:grid;place-items:center;user-select:none;-webkit-user-select:none;backdrop-filter:blur(4px);font-size:11px}
    .up{left:47px;top:0}.down{left:47px;bottom:0}.left{left:0;top:47px}.right{right:0;top:47px}
    .punch{left:0;bottom:4px}.side{right:0;bottom:4px}.round{right:42px;top:0}.block{left:71px;top:0}.blitz{left:71px;bottom:0}
    @media (pointer:coarse),(max-width:850px){#touch{display:block}#hint{display:none}}
  </style>
</head>
<body>
<div id="ui">
  <div id="score">BRADLEY 0 — 0 RYAN</div>
  <div id="status">FIRST TO 5</div>
  <div id="hint">WASD move · J punch · K side kick · U round kick · SPACE blitz · L block · R restart</div>
</div>
<div id="touch">
  <div class="pad">
    <div class="btn up" data-key="w">▲</div><div class="btn down" data-key="s">▼</div>
    <div class="btn left" data-key="a">◀</div><div class="btn right" data-key="d">▶</div>
  </div>
  <div class="actions">
    <div class="btn punch" data-tap="j">PUNCH</div><div class="btn side" data-tap="k">SIDE</div><div class="btn round" data-tap="u">ROUND</div><div class="btn block" data-key="l">BLOCK</div><div class="btn blitz" data-tap=" ">BLITZ</div>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x141820);scene.fog=new THREE.Fog(0x141820,16,34);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,100);camera.position.set(0,4.35,8.7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x332820,1.55));
const key=new THREE.DirectionalLight(0xffffff,3.4);key.position.set(-4,8,5);key.castShadow=true;scene.add(key);
const rim=new THREE.DirectionalLight(0x7ea6ff,1.7);rim.position.set(5,5,-4);scene.add(rim);
const warm=new THREE.PointLight(0xffd9a3,20,12,2);warm.position.set(0,3.2,-3.9);scene.add(warm);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,10),new THREE.MeshStandardMaterial({color:0x8c775a,roughness:.75,metalness:.03}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.45,1.5,64),new THREE.MeshBasicMaterial({color:0x272b33,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.01;scene.add(ring);
const matEdge=new THREE.MeshStandardMaterial({color:0x15181e,roughness:.7});for(const x of [-5.5,5.5]){const m=new THREE.Mesh(new THREE.BoxGeometry(.08,.025,9),matEdge);m.position.set(x,.015,0);scene.add(m)}for(const z of [-4,4]){const m=new THREE.Mesh(new THREE.BoxGeometry(11,.025,.08),matEdge);m.position.set(0,.015,z);scene.add(m)}
const wall=new THREE.Mesh(new THREE.BoxGeometry(14,4.2,.25),new THREE.MeshStandardMaterial({color:0x262b34,roughness:.92}));wall.position.set(0,2.05,-5);wall.receiveShadow=true;scene.add(wall);
for(let i=-5;i<=5;i+=2){const panel=new THREE.Mesh(new THREE.BoxGeometry(1.45,1.8,.05),new THREE.MeshStandardMaterial({color:i%4===0?0x8d1f28:0xe7e2d8,roughness:.82}));panel.position.set(i,2.42,-4.84);scene.add(panel)}
function labelTexture(text){const c=document.createElement('canvas');c.width=1024;c.height=256;const g=c.getContext('2d');g.fillStyle='#151820';g.fillRect(0,0,c.width,c.height);g.fillStyle='#f2f0ea';g.font='900 96px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(text,c.width/2,c.height/2);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const sign=new THREE.Mesh(new THREE.PlaneGeometry(5.5,1.2),new THREE.MeshBasicMaterial({map:labelTexture('PBK  •  PATH TO BLACK BELT')}));sign.position.set(0,3.45,-4.81);scene.add(sign);
function limb(len,r,mat){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,6,12),mat);m.position.y=-(len/2);m.castShadow=true;g.add(m);return g}
function makeFighter(name,x,accent){const root=new THREE.Group();scene.add(root);root.position.set(x,0,0);const gi=new THREE.MeshStandardMaterial({color:0x0d0e11,roughness:.55});const skin=new THREE.MeshStandardMaterial({color:0xc8916c,roughness:.7});const pad=new THREE.MeshStandardMaterial({color:accent,roughness:.5,metalness:.03});const hips=new THREE.Group();hips.position.y=.95;root.add(hips);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.37,.82,7,14),gi);torso.position.y=.57;torso.scale.z=.82;torso.castShadow=true;hips.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,22,18),skin);head.position.y=1.5;head.castShadow=true;hips.add(head);const belt=new THREE.Mesh(new THREE.BoxGeometry(.88,.12,.33),new THREE.MeshStandardMaterial({color:0x050505,roughness:.45}));belt.position.y=.18;hips.add(belt);const chest=new THREE.Mesh(new THREE.BoxGeometry(.76,.12,.42),pad);chest.position.set(0,.75,.23);hips.add(chest);const shoulderL=new THREE.Group();shoulderL.position.set(-.39,.98,0);hips.add(shoulderL);const armL=limb(.61,.105,gi);shoulderL.add(armL);const fistL=new THREE.Mesh(new THREE.SphereGeometry(.14,14,12),pad);fistL.position.y=-.69;armL.add(fistL);const shoulderR=new THREE.Group();shoulderR.position.set(.39,.98,0);hips.add(shoulderR);const armR=limb(.61,.105,gi);shoulderR.add(armR);const fistR=new THREE.Mesh(new THREE.SphereGeometry(.14,14,12),pad);fistR.position.y=-.69;armR.add(fistR);const legL=limb(.84,.135,gi);legL.position.set(-.21,.17,0);hips.add(legL);const footL=new THREE.Mesh(new THREE.BoxGeometry(.21,.12,.44),skin);footL.position.set(0,-.94,.13);legL.add(footL);const legR=limb(.84,.135,gi);legR.position.set(.21,.17,0);hips.add(legR);const footR=new THREE.Mesh(new THREE.BoxGeometry(.21,.12,.44),skin);footR.position.set(0,-.94,.13);legR.add(footR);return{name,root,hips,torso,head,shoulderL,shoulderR,armL,armR,legL,legR,footL,footR,score:0,cooldown:0,attack:null,blocking:false,vel:new THREE.Vector3(),stun:0,moveBlend:0,blitz:0}}
const player=makeFighter('BRADLEY',-2.25,0x246bd7),ai=makeFighter('RYAN',2.25,0xc8343c);
const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='r')restart()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
for(const el of document.querySelectorAll('[data-key]')){const k=el.dataset.key;const on=e=>{e.preventDefault();keys[k]=true};const off=e=>{e.preventDefault();keys[k]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}for(const el of document.querySelectorAll('[data-tap]')){el.addEventListener('pointerdown',e=>{e.preventDefault();keys[el.dataset.tap]=true})}
let state='play',resetTimer=0,hitFlash=0,shake=0,aiThink=.5;const scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');
const ATTACKS={punch:{points:1,range:1.14,windup:.08,active:.10,recovery:.25,cool:.38},side:{points:2,range:1.62,windup:.15,active:.14,recovery:.40,cool:.72},round:{points:2,range:1.50,windup:.13,active:.15,recovery:.44,cool:.78},blitz:{points:1,range:1.20,windup:.05,active:.12,recovery:.30,cool:.62}};
function updateUI(msg=''){scoreEl.textContent=`BRADLEY ${player.score} — ${ai.score} RYAN`;statusEl.textContent=msg||'FIRST TO 5'}function restart(){player.score=ai.score=0;state='play';resetTimer=0;placeFighters();updateUI('FIRST TO 5')}function placeFighters(){player.root.position.set(-2.25,0,0);ai.root.position.set(2.25,0,0);for(const f of [player,ai]){f.attack=null;f.cooldown=0;f.blocking=false;f.stun=0;f.blitz=0}}function horizontalDistance(a,b){const dx=a.root.position.x-b.root.position.x,dz=a.root.position.z-b.root.position.z;return Math.hypot(dx,dz)}function facingAmount(f,target){const forward=new THREE.Vector3(0,0,1).applyQuaternion(f.root.quaternion);const to=target.root.position.clone().sub(f.root.position).setY(0).normalize();return forward.dot(to)}function startAttack(f,type){if(state!=='play'||f.cooldown>0||f.attack||f.stun>0)return;const s=ATTACKS[type];f.cooldown=s.cool;f.attack={type,t:0,landed:false};if(type==='blitz')f.blitz=.18}function attackPhase(a){const s=ATTACKS[a.type];if(a.t<s.windup)return'windup';if(a.t<s.windup+s.active)return'active';return'recovery'}function canHit(attacker,target,spec){return horizontalDistance(attacker,target)<=spec.range&&facingAmount(attacker,target)>.18}
function sparkAt(a,b,blocked=false){const p=a.root.position.clone().lerp(b.root.position,.58);p.y=1.25;for(let i=0;i<8;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.035,6,4),new THREE.MeshBasicMaterial({color:blocked?0xbfd3ff:0xffe29b}));m.position.copy(p);scene.add(m);const v=new THREE.Vector3((Math.random()-.5)*2,Math.random()*1.2,(Math.random()-.5)*2);let life=.18;const tick=()=>{life-=.016;m.position.addScaledVector(v,.016);m.scale.multiplyScalar(.90);if(life>0)requestAnimationFrame(tick);else scene.remove(m)};tick()}}
function registerHit(attacker,target,type){const s=ATTACKS[type];if(target.blocking){target.stun=.12;hitFlash=.06;shake=.05;sparkAt(attacker,target,true);updateUI('BLOCK');return}attacker.score+=s.points;target.stun=.26;hitFlash=.15;shake=.13;sparkAt(attacker,target,false);state='reset';resetTimer=1.05;const label=type==='punch'?'PUNCH':type==='side'?'SIDE KICK':type==='round'?'ROUND KICK':'BLITZ';updateUI(`${attacker.name} — ${label} +${s.points}`);if(attacker.score>=5){state='over';updateUI(`${attacker.name} WINS — PRESS R`)}}
function resetPose(f){f.hips.rotation.set(0,0,0);f.shoulderL.rotation.set(-.72,0,-.28);f.shoulderR.rotation.set(-.72,0,.28);f.legL.rotation.set(0,0,0);f.legR.rotation.set(0,0,0)}
function animateFighter(f,dt){resetPose(f);f.cooldown=Math.max(0,f.cooldown-dt);f.stun=Math.max(0,f.stun-dt);f.blitz=Math.max(0,f.blitz-dt);const moving=f.vel.lengthSq()>.05;f.moveBlend+=((moving?1:0)-f.moveBlend)*Math.min(1,dt*10);const gait=Math.sin(performance.now()*.014)*.11*f.moveBlend;f.legL.rotation.x=gait;f.legR.rotation.x=-gait;f.hips.position.y=.95+Math.abs(Math.sin(performance.now()*.014))*.03*f.moveBlend;if(f.blocking&&!f.attack){f.shoulderL.rotation.x=-1.3;f.shoulderR.rotation.x=-1.3;f.shoulderL.rotation.z=-.18;f.shoulderR.rotation.z=.18}if(!f.attack)return;f.attack.t+=dt;const a=f.attack,s=ATTACKS[a.type],phase=attackPhase(a);const p=Math.min(1,a.t/(s.windup+s.active+s.recovery));if(a.type==='punch'){const q=phase==='active'?1:Math.sin(p*Math.PI);f.shoulderR.rotation.x=-1.55*q;f.shoulderR.rotation.z=.08;f.hips.rotation.y=-.18*q}if(a.type==='side'){const q=phase==='active'?1:Math.sin(p*Math.PI);f.legR.rotation.x=-1.34*q;f.legR.rotation.z=-1.02*q;f.hips.rotation.y=-.33*q;f.hips.rotation.z=.12*q}if(a.type==='round'){const q=phase==='active'?1:Math.sin(p*Math.PI);f.legR.rotation.x=-.58*q;f.legR.rotation.z=-1.50*q;f.hips.rotation.y=-.82*q}if(a.type==='blitz'){const q=phase==='active'?1:Math.sin(p*Math.PI);f.shoulderL.rotation.x=-1.50*q;f.hips.rotation.z=-.08*q}if(phase==='active'&&!a.landed){const target=f===player?ai:player;if(canHit(f,target,s)){a.landed=true;registerHit(f,target,a.type)}}if(a.t>=s.windup+s.active+s.recovery)f.attack=null}
function face(f,target){const dx=target.root.position.x-f.root.position.x,dz=target.root.position.z-f.root.position.z;f.root.rotation.y=Math.atan2(dx,dz)}function forwardVector(f){return new THREE.Vector3(0,0,1).applyQuaternion(f.root.quaternion).normalize()}
function updatePlayer(dt){player.vel.set(0,0,0);player.blocking=!!keys.l&&state==='play'&&!player.attack;if(state!=='play'||player.stun>0)return;const speed=player.blocking?1.25:3.55;if(keys.w)player.vel.z-=1;if(keys.s)player.vel.z+=1;if(keys.a)player.vel.x-=1;if(keys.d)player.vel.x+=1;if(player.vel.lengthSq()){player.vel.normalize().multiplyScalar(speed);player.root.position.addScaledVector(player.vel,dt)}if(player.blitz>0)player.root.position.addScaledVector(forwardVector(player),dt*5.8);player.root.position.x=THREE.MathUtils.clamp(player.root.position.x,-5.15,5.15);player.root.position.z=THREE.MathUtils.clamp(player.root.position.z,-3.65,3.65);if(keys.j){keys.j=false;startAttack(player,'punch')}if(keys.k){keys.k=false;startAttack(player,'side')}if(keys.u){keys.u=false;startAttack(player,'round')}if(keys[' ']){keys[' ']=false;startAttack(player,'blitz')}}
function updateAI(dt){ai.vel.set(0,0,0);aiThink-=dt;if(state!=='play'||ai.stun>0)return;const d=horizontalDistance(ai,player);if(d>1.68){const dir=player.root.position.clone().sub(ai.root.position).setY(0).normalize();ai.vel.copy(dir).multiplyScalar(2.4);ai.root.position.addScaledVector(ai.vel,dt);ai.blocking=false}else if(aiThink<=0&&!ai.attack){aiThink=.42+Math.random()*.48;const r=Math.random();if(r<.19){ai.blocking=true;setTimeout(()=>ai.blocking=false,250)}else if(r<.47)startAttack(ai,'punch');else if(r<.70)startAttack(ai,'side');else if(r<.87)startAttack(ai,'round');else startAttack(ai,'blitz')}if(ai.blitz>0)ai.root.position.addScaledVector(forwardVector(ai),dt*5.2)}function separate(){const d=horizontalDistance(player,ai);if(d<.74&&d>0){const v=player.root.position.clone().sub(ai.root.position).setY(0).normalize();const push=(.74-d)*.5;player.root.position.addScaledVector(v,push);ai.root.position.addScaledVector(v,-push)}}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);if(state==='reset'){resetTimer-=dt;if(resetTimer<=0){placeFighters();state='play';updateUI('FIGHT')}}updatePlayer(dt);updateAI(dt);separate();face(player,ai);face(ai,player);animateFighter(player,dt);animateFighter(ai,dt);const mid=player.root.position.clone().add(ai.root.position).multiplyScalar(.5);const spread=Math.max(4.8,horizontalDistance(player,ai));const desiredZ=mid.z+6.8+spread*.36;const jitter=shake>0?(Math.random()-.5)*.10:0;shake=Math.max(0,shake-dt);camera.position.x+=((mid.x+jitter)-camera.position.x)*.07;camera.position.y+=(4.25+jitter-camera.position.y)*.06;camera.position.z+=(desiredZ+jitter-camera.position.z)*.07;camera.lookAt(mid.x,1.0,mid.z);if(hitFlash>0){hitFlash-=dt;renderer.toneMappingExposure=1.55}else renderer.toneMappingExposure=1.05;renderer.render(scene,camera)}placeFighters();updateUI();loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
