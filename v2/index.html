<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>PBK: Path to Black Belt — Milestone 1</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1015;font-family:system-ui,Segoe UI,Arial,sans-serif;touch-action:none}canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 10px #000}
#score{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:12px;background:#090b0fe6;border:1px solid #ffffff26;font-size:clamp(21px,4vw,34px);font-weight:950;letter-spacing:.7px;white-space:nowrap}
#status{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:clamp(14px,2.5vw,20px);font-weight:900;letter-spacing:.7px;text-align:center}
#hint{position:absolute;left:14px;bottom:12px;background:#000b;border:1px solid #ffffff22;padding:9px 11px;border-radius:10px;font-size:12px}
#touch{position:fixed;inset:0;pointer-events:none;display:none}.pad,.actions{position:absolute;bottom:18px;pointer-events:auto}.pad{left:16px;width:156px;height:156px}.actions{right:16px;width:224px;height:176px}
.btn{position:absolute;width:62px;height:62px;border:1px solid #ffffff55;border-radius:50%;background:#111c;color:#fff;font-weight:900;display:grid;place-items:center;user-select:none;-webkit-user-select:none;backdrop-filter:blur(4px);font-size:10px}
.up{left:47px;top:0}.down{left:47px;bottom:0}.left{left:0;top:47px}.right{right:0;top:47px}.punch{left:0;bottom:0}.side{right:0;bottom:0}.round{right:42px;top:0}.block{left:79px;top:0}.blitz{left:79px;bottom:0}.angle{left:0;top:0}
@media(pointer:coarse),(max-width:850px){#touch{display:block}#hint{display:none}}
</style>
</head>
<body>
<div id="ui"><div id="score">BRADLEY 0 — 0 RYAN</div><div id="status">FIRST TO 5</div><div id="hint">WASD move · J punch · K side kick · U round kick · SPACE blitz · L block · Q angle-out · R restart</div></div>
<div id="touch"><div class="pad"><div class="btn up" data-hold="w">▲</div><div class="btn down" data-hold="s">▼</div><div class="btn left" data-hold="a">◀</div><div class="btn right" data-hold="d">▶</div></div><div class="actions"><div class="btn angle" data-tap="q">ANGLE</div><div class="btn punch" data-tap="j">PUNCH</div><div class="btn side" data-tap="k">SIDE</div><div class="btn round" data-tap="u">ROUND</div><div class="btn block" data-hold="l">BLOCK</div><div class="btn blitz" data-tap=" ">BLITZ</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x141820);scene.fog=new THREE.Fog(0x141820,16,34);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,100);camera.position.set(0,4.3,8.7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x332820,1.5));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-4,8,5);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x7ea6ff,1.7);rim.position.set(5,5,-4);scene.add(rim);const warm=new THREE.PointLight(0xffd9a3,18,12,2);warm.position.set(0,3.2,-3.9);scene.add(warm);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,10),new THREE.MeshStandardMaterial({color:0x8c775a,roughness:.76}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const ring=new THREE.Mesh(new THREE.RingGeometry(1.45,1.5,64),new THREE.MeshBasicMaterial({color:0x272b33,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.01;scene.add(ring);const wall=new THREE.Mesh(new THREE.BoxGeometry(14,4.2,.25),new THREE.MeshStandardMaterial({color:0x262b34,roughness:.92}));wall.position.set(0,2.05,-5);scene.add(wall);
function labelTexture(text){const c=document.createElement('canvas');c.width=1024;c.height=256;const g=c.getContext('2d');g.fillStyle='#151820';g.fillRect(0,0,c.width,c.height);g.fillStyle='#f2f0ea';g.font='900 90px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(text,c.width/2,c.height/2);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}const sign=new THREE.Mesh(new THREE.PlaneGeometry(5.8,1.25),new THREE.MeshBasicMaterial({map:labelTexture('PBK • PATH TO BLACK BELT')}));sign.position.set(0,3.45,-4.81);scene.add(sign);

function limb(len,r,mat){const g=new THREE.Group(),m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,6,12),mat);m.position.y=-len/2;m.castShadow=true;g.add(m);return g}
function fighter(name,x,accent){
 const root=new THREE.Group();scene.add(root);root.position.set(x,0,0);
 const gi=new THREE.MeshStandardMaterial({color:0x0d0e11,roughness:.55}),skin=new THREE.MeshStandardMaterial({color:0xc8916c,roughness:.7}),pad=new THREE.MeshStandardMaterial({color:accent,roughness:.5});
 const hips=new THREE.Group();hips.position.y=.95;root.add(hips);
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.37,.82,7,14),gi);torso.position.y=.57;torso.scale.z=.82;torso.castShadow=true;hips.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.25,22,18),skin);head.position.y=1.5;head.castShadow=true;hips.add(head);
 const belt=new THREE.Mesh(new THREE.BoxGeometry(.88,.12,.33),new THREE.MeshStandardMaterial({color:0x050505}));belt.position.y=.18;hips.add(belt);
 const chest=new THREE.Mesh(new THREE.BoxGeometry(.76,.12,.42),pad);chest.position.set(0,.75,.23);hips.add(chest);
 const shoulderL=new THREE.Group();shoulderL.position.set(-.39,.98,0);hips.add(shoulderL);const armL=limb(.61,.105,gi);shoulderL.add(armL);const fistL=new THREE.Mesh(new THREE.SphereGeometry(.14,14,12),pad);fistL.position.y=-.70;armL.add(fistL);
 const shoulderR=new THREE.Group();shoulderR.position.set(.39,.98,0);hips.add(shoulderR);const armR=limb(.61,.105,gi);shoulderR.add(armR);const fistR=new THREE.Mesh(new THREE.SphereGeometry(.14,14,12),pad);fistR.position.y=-.70;armR.add(fistR);
 const legL=limb(.84,.135,gi);legL.position.set(-.21,.17,0);hips.add(legL);const footL=new THREE.Mesh(new THREE.BoxGeometry(.21,.12,.44),skin);footL.position.set(0,-.94,.13);legL.add(footL);
 const legR=limb(.84,.135,gi);legR.position.set(.21,.17,0);hips.add(legR);const footR=new THREE.Mesh(new THREE.BoxGeometry(.21,.12,.44),skin);footR.position.set(0,-.94,.13);legR.add(footR);
 return{name,root,hips,torso,head,shoulderL,shoulderR,fistL,fistR,legL,legR,footL,footR,score:0,cooldown:0,attack:null,blocking:false,vel:new THREE.Vector3(),stun:0,moveBlend:0,evade:0,pressure:0};
}
const player=fighter('BRADLEY',-2.25,0x246bd7),ai=fighter('RYAN',2.25,0xc8343c);

const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='r')restart()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-hold]').forEach(el=>{const k=el.dataset.hold,on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)});document.querySelectorAll('[data-tap]').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();keys[el.dataset.tap]=true}));

let state='play',resetTimer=0,hitFlash=0,shake=0,aiThink=.5,slowmo=0;const scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');
const ATTACKS={punch:{points:1,windup:.08,active:.10,recovery:.24,cool:.38,reach:.42},side:{points:2,windup:.15,active:.14,recovery:.40,cool:.72,reach:.48},round:{points:2,windup:.13,active:.15,recovery:.44,cool:.78,reach:.48},blitz:{points:1,windup:.05,active:.12,recovery:.28,cool:.60,reach:.45}};
function ui(msg=''){scoreEl.textContent=`BRADLEY ${player.score} — ${ai.score} RYAN`;statusEl.textContent=msg||'FIRST TO 5'}
function place(){player.root.position.set(-2.25,0,0);ai.root.position.set(2.25,0,0);for(const f of[player,ai]){f.attack=null;f.cooldown=0;f.blocking=false;f.stun=0;f.evade=0;f.pressure=0}}
function restart(){player.score=ai.score=0;state='play';resetTimer=0;place();ui('FIRST TO 5')}
function dist(a,b){const dx=a.root.position.x-b.root.position.x,dz=a.root.position.z-b.root.position.z;return Math.hypot(dx,dz)}
function facing(f,t){const fw=new THREE.Vector3(0,0,1).applyQuaternion(f.root.quaternion),to=t.root.position.clone().sub(f.root.position).setY(0).normalize();return fw.dot(to)}
function start(f,type){if(state!=='play'||f.cooldown>0||f.attack||f.stun>0)return;const s=ATTACKS[type];f.cooldown=s.cool;f.attack={type,t:0,landed:false};if(type==='blitz')f.pressure=.22}
function phase(a){const s=ATTACKS[a.type];return a.t<s.windup?'windup':a.t<s.windup+s.active?'active':'recovery'}
function worldPos(obj){const p=new THREE.Vector3();obj.getWorldPosition(p);return p}
function contact(attacker,target,type){
 if(facing(attacker,target)<.18||target.evade>0)return false;
 const source=(type==='punch'||type==='blitz')?worldPos(attacker.fistR):worldPos(attacker.footR);
 const chest=worldPos(target.torso),head=worldPos(target.head);chest.y+=.15;
 const radius=ATTACKS[type].reach;
 return source.distanceTo(chest)<=radius||source.distanceTo(head)<=radius*.9;
}
function spark(a,b,blocked=false){const p=a.root.position.clone().lerp(b.root.position,.58);p.y=1.25;for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.032,6,4),new THREE.MeshBasicMaterial({color:blocked?0xbfd3ff:0xffdf8d}));m.position.copy(p);scene.add(m);const v=new THREE.Vector3((Math.random()-.5)*2.2,Math.random()*1.4,(Math.random()-.5)*2.2);let life=.18;const tick=()=>{life-=.016;m.position.addScaledVector(v,.016);m.scale.multiplyScalar(.89);life>0?requestAnimationFrame(tick):scene.remove(m)};tick()}}
function hit(a,b,type){const s=ATTACKS[type];if(b.blocking){b.stun=.10;shake=.045;hitFlash=.04;spark(a,b,true);ui('BLOCKED');return}a.score+=s.points;b.stun=.25;shake=.12;hitFlash=.13;slowmo=.07;spark(a,b);state='reset';resetTimer=1.0;const label=type==='punch'?'PUNCH':type==='side'?'SIDE KICK':type==='round'?'ROUND KICK':'BLITZ';ui(`${a.name} — ${label} +${s.points}`);if(a.score>=5){state='over';ui(`${a.name} WINS — PRESS R`)}}
function pose(f){f.hips.rotation.set(0,0,0);f.shoulderL.rotation.set(-.72,0,-.28);f.shoulderR.rotation.set(-.72,0,.28);f.legL.rotation.set(0,0,0);f.legR.rotation.set(0,0,0)}
function animateF(f,dt){
 pose(f);f.cooldown=Math.max(0,f.cooldown-dt);f.stun=Math.max(0,f.stun-dt);f.evade=Math.max(0,f.evade-dt);f.pressure=Math.max(0,f.pressure-dt);
 const moving=f.vel.lengthSq()>.05;f.moveBlend+=((moving?1:0)-f.moveBlend)*Math.min(1,dt*10);const gait=Math.sin(performance.now()*.014)*.11*f.moveBlend;f.legL.rotation.x=gait;f.legR.rotation.x=-gait;f.hips.position.y=.95+Math.abs(Math.sin(performance.now()*.014))*.03*f.moveBlend;
 if(f.blocking&&!f.attack){f.shoulderL.rotation.x=-1.3;f.shoulderR.rotation.x=-1.3;f.shoulderL.rotation.z=-.18;f.shoulderR.rotation.z=.18}
 if(f.evade>0)f.hips.rotation.z=.18*Math.sin((f.evade/.16)*Math.PI);
 if(!f.attack)return;
 f.attack.t+=dt;const a=f.attack,s=ATTACKS[a.type],ph=phase(a),p=Math.min(1,a.t/(s.windup+s.active+s.recovery)),q=ph==='active'?1:Math.sin(p*Math.PI);
 if(a.type==='punch'){f.shoulderR.rotation.x=-1.58*q;f.shoulderR.rotation.z=.06;f.hips.rotation.y=-.18*q}
 if(a.type==='side'){f.legR.rotation.x=-1.62*q;f.legR.rotation.z=-.84*q;f.hips.rotation.y=-.42*q;f.hips.rotation.z=.12*q}
 if(a.type==='round'){f.legR.rotation.x=-.62*q;f.legR.rotation.z=-1.50*q;f.hips.rotation.y=-.86*q}
 if(a.type==='blitz'){f.shoulderR.rotation.x=-1.58*q;f.hips.rotation.y=-.18*q;f.hips.rotation.z=-.10*q}
 scene.updateMatrixWorld(true);
 if(ph==='active'&&!a.landed){const t=f===player?ai:player;if(contact(f,t,a.type)){a.landed=true;hit(f,t,a.type)}}
 if(a.t>=s.windup+s.active+s.recovery)f.attack=null;
}
function face(f,t){const dx=t.root.position.x-f.root.position.x,dz=t.root.position.z-f.root.position.z;f.root.rotation.y=Math.atan2(dx,dz)}
function moveToward(f,t,speed,dt){const d=t.root.position.clone().sub(f.root.position).setY(0).normalize();f.vel.copy(d).multiplyScalar(speed);f.root.position.addScaledVector(f.vel,dt)}
function updatePlayer(dt){
 player.vel.set(0,0,0);player.blocking=!!keys.l&&state==='play'&&!player.attack;if(state!=='play'||player.stun>0)return;
 const speed=player.blocking?1.25:3.45;if(keys.w)player.vel.z-=1;if(keys.s)player.vel.z+=1;if(keys.a)player.vel.x-=1;if(keys.d)player.vel.x+=1;if(player.vel.lengthSq()){player.vel.normalize().multiplyScalar(speed);player.root.position.addScaledVector(player.vel,dt)}
 if(keys.q){keys.q=false;const away=player.root.position.clone().sub(ai.root.position).setY(0).normalize();const side=new THREE.Vector3(-away.z,0,away.x);player.root.position.addScaledVector(side,.72);player.root.position.addScaledVector(away,.24);player.evade=.16}
 if(keys[' ']){keys[' ']=false;const before=dist(player,ai);if(before<3.0&&before>1.10){moveToward(player,ai,7.6,.11);start(player,'blitz')}}
 if(keys.j){keys.j=false;start(player,'punch')}if(keys.k){keys.k=false;start(player,'side')}if(keys.u){keys.u=false;start(player,'round')}
 player.root.position.x=THREE.MathUtils.clamp(player.root.position.x,-5.15,5.15);player.root.position.z=THREE.MathUtils.clamp(player.root.position.z,-3.65,3.65);
}
function updateAI(dt){
 ai.vel.set(0,0,0);aiThink-=dt;if(state!=='play'||ai.stun>0)return;const d=dist(ai,player);
 if(d>2.3){moveToward(ai,player,2.2,dt);ai.blocking=false;return}
 if(d<.88){const away=ai.root.position.clone().sub(player.root.position).setY(0).normalize();ai.root.position.addScaledVector(away,1.8*dt)}
 if(aiThink<=0&&!ai.attack){aiThink=.40+Math.random()*.52;const r=Math.random();if(player.attack&&phase(player.attack)==='recovery'&&d<1.45){start(ai,r<.62?'punch':'round');return}if(d>1.35&&d<2.75&&r<.20){moveToward(ai,player,7.0,.11);start(ai,'blitz')}else if(r<.38){ai.blocking=true;setTimeout(()=>ai.blocking=false,220)}else if(d<1.15)start(ai,'punch');else start(ai,r<.70?'side':'round')}
}
function separate(){const d=dist(player,ai);if(d<.70&&d>0){const v=player.root.position.clone().sub(ai.root.position).setY(0).normalize(),push=(.70-d)*.5;player.root.position.addScaledVector(v,push);ai.root.position.addScaledVector(v,-push)}}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.033);if(slowmo>0){slowmo-=dt;dt*=.35}if(state==='reset'){resetTimer-=dt;if(resetTimer<=0){place();state='play';ui('FIGHT')}}updatePlayer(dt);updateAI(dt);separate();face(player,ai);face(ai,player);animateF(player,dt);animateF(ai,dt);const mid=player.root.position.clone().add(ai.root.position).multiplyScalar(.5),spread=Math.max(4.8,dist(player,ai)),desiredZ=mid.z+6.65+spread*.35;camera.position.x+=(mid.x-camera.position.x)*.07;camera.position.y+=(4.2-camera.position.y)*.06;camera.position.z+=(desiredZ-camera.position.z)*.07;if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake}camera.lookAt(mid.x,1.0,mid.z);renderer.toneMappingExposure=hitFlash>0?1.42:1.05;if(hitFlash>0)hitFlash-=dt;renderer.render(scene,camera)}
place();ui();loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
